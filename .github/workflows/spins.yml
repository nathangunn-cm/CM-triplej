name: Radio spin sweep

on:
  schedule:
    - cron: "0 19 * * *"   # daily, ~6am Melbourne
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to fetch (use 90 for a first backfill)"
        default: "7"

permissions:
  contents: write

concurrency:
  group: spin-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fetch spins
        run: python spins.py --days ${{ github.event.inputs.days || '2' }}

      - name: Save results
        run: |
          git config user.name "spin-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/plays.json docs/data.json
          git diff --cached --quiet || git commit -m "Spin sweep $(date -u +%F)"
          git push
